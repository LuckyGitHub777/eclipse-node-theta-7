<path d="M500.00,135.00 L658.37,828.85 L214.63,272.43 L855.85,581.22 L144.15,581.22 L785.37,272.43 L341.63,828.85 L500.00,135.00 Z" fill="none" stroke="#8d4cff" stroke-opacity=".5" stroke-width="24" filter="url(#glow)"/>
<path d="M500.00,135.00 L658.37,828.85 L214.63,272.43 L855.85,581.22 L144.15,581.22 L785.37,272.43 L341.63,828.85 L500.00,135.00 Z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
<g fill="#08040f" stroke="#f2c875" stroke-width="3"><g transform="translate(500.00 135.00)"><circle r="19"/><circle class="dot" r="6"/></g>
