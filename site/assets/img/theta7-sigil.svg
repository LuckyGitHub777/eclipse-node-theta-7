<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Eclipse Node Theta-7 Star Sigil</title>
<desc id="desc">A violet and gold seven-pointed geometric eclipse sigil.</desc>
<defs>
  <radialGradient id="bg"><stop stop-color="#211039"/><stop offset=".48" stop-color="#0c0617"/><stop offset="1" stop-color="#040207"/></radialGradient>
  <radialGradient id="corona"><stop offset=".54" stop-color="#050208"/><stop offset=".64" stop-color="#050208"/><stop offset=".69" stop-color="#ffe7ad"/><stop offset=".75" stop-color="#f0b64e" stop-opacity=".88"/><stop offset=".9" stop-color="#9d5cff" stop-opacity=".18"/><stop offset="1" stop-color="#9d5cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".18" stop-color="#e8dcff"/><stop offset=".5" stop-color="#a46cff"/><stop offset="1" stop-color="#5d24bd" stop-opacity=".12"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0bf"/><stop offset=".42" stop-color="#f2c875"/><stop offset="1" stop-color="#a76b24"/></linearGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="stars" width="115" height="115" patternUnits="userSpaceOnUse"><circle cx="13" cy="22" r="1.2" fill="#fff" opacity=".42"/><circle cx="87" cy="64" r=".8" fill="#d9c7ff" opacity=".55"/><circle cx="55" cy="102" r="1" fill="#f2c875" opacity=".38"/></pattern>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<rect width="1000" height="1000" fill="url(#stars)" opacity=".55"/>
<circle cx="500" cy="500" r="435" fill="none" stroke="#f2c875" stroke-opacity=".28" stroke-width="2"/>
