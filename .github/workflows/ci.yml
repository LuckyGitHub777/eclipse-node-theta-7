name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked package metadata
        run: npm ci --ignore-scripts

      - name: Run repository tests
        run: npm test

      - name: Verify integrity manifest
        run: npm run verify:manifest

      - name: Install browser-test tooling
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-browser.txt
          python3 -m playwright install --with-deps chromium

      - name: Run browser interaction tests
        run: npm run test:browser
